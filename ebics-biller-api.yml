openapi: 3.0.3
info:
  title: EBICS Biller API
  description: |
    Biller-facing EBICS API exposed by eBillGuardian.

    The EBICS Biller API allows billers to interact with their bank over EBICS (Electronic Banking Internet Communication Standard, version 3.0 / H005) without operating their own EBICS client. Billte's eBillGuardian acts as a managed EBICS client on behalf of the biller, exposing a thin, JWT-secured REST surface for the most common business transaction formats.

    Examples and extra information - https://github.com/billte-engineering/ebill-swp-redoc.

    Supported operations include:

    * **HTD** – list subscribed BTF formats and bank accounts
    * **BTU** – upload payment / direct-debit orders to the bank
    * **BTD** – download statements, reports and notifications from the bank
    * **HAA** – BTFs / order types with data ready to retrieve from the bank (retrievable downloads)
    * **HAC** – customer acknowledgements (pain.002; status reasons for prior orders / BTU)
    * **C52 / C53 / C54 – ISO & canonical parse** – download CAMT.052 / .053 / .054 via BTD without cloud upload and return either ISO-shaped or compact canonical JSON

    ### General Note

    This documentation has been compiled with the greatest care, but may nevertheless contain errors or inaccuracies. Billte cannot assume any legal responsibility or any liability for erroneous information or its consequences.

    If you notice any errors in this documentation or have any suggestions for improvements, we would be grateful to receive your feedback; please open an issue on our repository: https://github.com/billte-engineering/ebill-swp-redoc.

    ### Environments

    - **Production environment [code:P] -**

      `baseUrl` : https://guard-api.ebill.billte.ch

    - **Stable staging environment [code:XP] -**

      `baseUrl` : https://guard-api-xp.ebill.billte.ch

    - **Unstable staging environment [code:XE] -**

      `baseUrl` : https://guard-api-xe.ebill.billte.ch

    ## Authentication flow
    1. Call **POST /swp/v1/billers/authenticate** with your `billerPid` and `billerSecret`.
    2. The response contains a JWT `token`. Pass it as `Authorization: Bearer <token>` on every EBICS call.
    3. The JWT encodes your granted **scopes** (`EBILL`, `EBICS`, or both) based on your account status.
       - `EBICS` scope is required to call any `/client/ebics/*` endpoint.
       - A biller with `ebicsStatus = ACTIVE` will have `EBICS` in their token scopes.
    4. You do **not** need to pass `ebicsUserId` or `billerId` — these are resolved internally from your JWT.
  contact:
    name: EBICS Biller API
    url: https://guard-api.ebill.billte.ch
  version: 1.1.0

servers:
  - url: https://guard-api.ebill.billte.ch
    description: Production [code:P]
  - url: https://guard-api-xp.ebill.billte.ch
    description: Stable staging [code:XP]
  - url: https://guard-api-xe.ebill.billte.ch
    description: Unstable staging [code:XE]

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized: billerPid not present in token"

    AuthenticateRequest:
      type: object
      required: [billerPid, billerSecret]
      properties:
        billerPid:
          type: string
          example: "41140074442216296"
        billerSecret:
          type: string
          example: "s3cr3t-uuid-value"

    AuthenticateResponse:
      type: object
      properties:
        type:
          type: string
          example: "Biller"
        billerPid:
          type: string
          example: "41140074442216296"
        token:
          type: string
          description: JWT containing billerPid, scopes, and expiry
          example: "eyJhbGci..."
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          example: 90000

    BTDRequest:
      type: object
      description: |
        Download a file (e.g. statement, report, etc.) via EBICS BTD (H005).
        Use the exact service parameters from your subscribed BTF (Business Transaction Formats) Call HTD to retrieve them.
      required: [serviceName, scope, msgName]
      properties:
        serviceName:
          type: string
          description: BTF service name (e.g. account reporting service family)
          example: "EOP"
        scope:
          type: string
          description: BTF scope value defined by the bank for this service
          example: "CH"
        serviceOption:
          type: string
          nullable: true
          description: Optional BTF service option if required by the bank
        containerType:
          type: string
          nullable: true
          description: Container type expected for returned data. Allowed values include XML, ZIP, and SVC.
          example: "ZIP"
        msgName:
          type: string
          description: Message name of the requested format
          example: "camt.053"
        msgNameVersion:
          type: string
          description: Message version
          example: "04"
        msgNameVariant:
          type: string
          nullable: true
          description: Message variant
        msgNameFormat:
          type: string
          nullable: true
          description: Message format
        startDate:
          type: string
          format: date
          description: Optional start date (inclusive) for historical data retrieval in yyyy-MM-dd format
          example: "2026-01-01"
        endDate:
          type: string
          format: date
          description: Optional end date (inclusive) for historical data retrieval in yyyy-MM-dd format
          example: "2026-04-19"

    BTDResponse:
      type: object
      properties:
        ebicsUserId:
          type: string
          description: EBICS user identifier used for the request
          example: "ZKB03305"
        status:
          type: string
          description: High-level processing status of the BTD operation
          example: "SUCCESS"
        message:
          type: string
          description: Human-readable message describing the BTD processing result
          nullable: true
        cloudUrl:
          type: string
          nullable: true
          description: Public signed cloud storage URL for accessing the downloaded file. For security reasons, don't share this URL with anyone. This URL expires after 24 hours.
        partialFilePath:
          type: string
          nullable: true
          description: Relative path within the cloud storage bucket for the downloaded file
        transactionId:
          type: string
          nullable: true
          description: EBICS transaction identifier returned by the bank (currently always null)
        orderId:
          type: string
          nullable: true
          description: EBICS order identifier associated with the BTD request (pattern like one letter followed by three alphanumeric characters)
        dataAvailabilityStatus:
          type: string
          nullable: true
          description: Data availability status derived from EBICS return codes (e.g. AVAILABLE, NO_DATA, ERROR)
        headerReturnCode:
          type: string
          nullable: true
          description: Header-level EBICS return code
        headerReturnText:
          type: string
          nullable: true
          description: Header-level EBICS return text
        bodyReturnCode:
          type: string
          nullable: true
          description: Body-level EBICS return code
        bodyReturnText:
          type: string
          nullable: true
          description: Body-level EBICS return text
        bodyReturnSymbolicName:
          type: string
          nullable: true
          description: Symbolic name for the body-level EBICS return code

    HTDRequest:
      type: object
      description: Retrieve the list of subscribed EBICS BTF formats for this biller (H005 HTD v3).
      properties: {}

    HTDResponse:
      type: object
      properties:
        ebicsUserId:
          type: string
          example: "ZKB03305"
        businessTransactionFormats:
          type: array
          description: List of subscribed BTF format combinations. Use these exact values in BTU/BTD requests.
          items:
            $ref: '#/components/schemas/HtdBusinessTransactionFormat'
        accounts:
          type: array
          description: List of bank accounts subscribed for this biller at the bank.
          items:
            type: object
            properties:
              id:
                type: string
                description: Internal account identifier
                example: "12345"
              currency:
                type: string
                example: "CHF"
              description:
                type: string
                nullable: true
              accountHolder:
                type: string
                example: "Mustermann AG"
              structuredAccountNumbers:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      example: "CH3900700115651849173"
                    international:
                      type: boolean
              nationalAccountNumbers:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    international:
                      type: boolean
              structuredBankCodes:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      example: "RAIFCH22XXX"
                    international:
                      type: boolean
                    prefix:
                      type: string
                      nullable: true
              nationalBankCodes:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      example: "81356"
                    format:
                      type: string
                      example: "other"

    HtdBusinessTransactionFormat:
      type: object
      description: |
        One BTF / restricted service descriptor: same dimensions in **HTD** (subscribed formats) and **HAA** (data ready
        to retrieve); see EBICS 3.0 §9.1.
      properties:
        serviceName:
          type: string
          nullable: true
          description: Service name component of the BTF (e.g. MCT, PSR, EOP).
          example: "MCT"
        scope:
          type: string
          nullable: true
          description: Country or institution scope (e.g. CH).
          example: "CH"
        serviceOption:
          type: string
          nullable: true
          description: Optional service option qualifier when present.
        containerType:
          type: string
          nullable: true
          description: Container or packaging hint from the bank (e.g. ZIP).
        msgName:
          type: string
          nullable: true
          description: ISO 20022 message name (e.g. pain.001, pain.002, camt.053).
          example: "pain.001"
        msgNameVersion:
          type: string
          nullable: true
          description: Message version identifier when provided.
          example: "03"
        msgNameVariant:
          type: string
          nullable: true
          description: Message variant when provided.
        msgNameFormat:
          type: string
          nullable: true
          description: Message format qualifier when provided.

    HacIdentification:
      type: object
      description: |
        One `OrgId/Othr` entry from HAC **pain.002** `StsRsnInf/Orgtr/Id` (EBICS 3.0 ch.10). Key–value pair for JSON:
        `schemeProprietary` is the semantic label (ISO 20022 `SchmeNm/Prtry`), `id` is the value (`Othr/Id`). Common
        `schemeProprietary` examples include `UserID`, `PartnerID`, `OrderID`, `AdminOrderType`, `TimeStamp`,
        `ServiceName`, `Scope`, `MsgName`; banks may emit further proprietary names.
      properties:
        id:
          type: string
          description: Value (`Othr/Id`); interpretation depends on `schemeProprietary`.
          example: "camt.053"
        schemeProprietary:
          type: string
          description: Semantic key (`Othr/SchmeNm/Prtry`); not an exhaustive standardized enum—values are bank-specific.
          example: "MsgName"

    HacStsRsnInfEntry:
      type: object
      description: |
        One `StsRsnInf` block from HAC **pain.002** (EBICS 3.0 ch.10; ISO 20022 status reason information).
      properties:
        originatorName:
          type: string
          nullable: true
          description: Originator name (`StsRsnInf/Orgtr/Nm`).
        identifications:
          type: array
          description: Zero or more entries from `Orgtr/Id/OrgId/Othr`.
          items:
            $ref: '#/components/schemas/HacIdentification'
        reasonCode:
          type: string
          nullable: true
          description: Reason / result code (`StsRsnInf/Rsn`); see EBICS 3.0 ch.10.3.
        reasonName:
          type: string
          nullable: true
          description: Name from EBICS 3.0 ch.10.3 `ExternalStatusReason1Code` annex when mapped; null if the code is not in the annex.
        reasonDescription:
          type: string
          nullable: true
          description: Definition from EBICS 3.0 ch.10.3; null if the code is not in the annex.
        additionalInformation:
          type: array
          description: Additional information lines (`StsRsnInf/AddtlInf`).
          items:
            type: string

    HAARequest:
      type: object
      description: |
        EBICS 3.0 H005 **HAA** request: list business transaction formats (BTFs) / services for which the bank currently
        has data ready to retrieve (available downloads; EBICS 3.0 §9.1). The JSON body is typically an empty object;
        `ebicsUserId` and `billerId` are resolved from the JWT.
      properties: {}

    HAAResponse:
      type: object
      description: |
        Parsed **HAA** response (EBICS 3.0 §9.1): order types / services for which downloadable data is available at
        the bank (`services`). On client or transport failure, `status` and `message` may describe the error.
      properties:
        ebicsUserId:
          type: string
          description: Resolved EBICS user id for this response.
          example: "ZKB03305"
        services:
          type: array
          description: Services (BTF / restricted service descriptors) with data ready to retrieve; empty when nothing is pending.
          items:
            $ref: '#/components/schemas/HtdBusinessTransactionFormat'
        message:
          type: string
          nullable: true
          description: Human-readable detail from the EBICS client or transport layer; null on success.
        status:
          type: string
          nullable: true
          description: Client-side status (e.g. `ERROR` on failure); null when the HAA order completed without client-side error.

    HACRequest:
      type: object
      description: |
        Request for **HAC** (customer acknowledgement, **pain.002**) — EBICS v3 (H005). Optional date range maps to
        `StandardOrderParams/DateRange`; **both** `startDate` and `endDate` **must** be set together, or **both** omitted.
        `ebicsUserId` and `billerId` are resolved from the JWT.
      properties:
        startDate:
          type: string
          format: date
          description: Optional start date (inclusive) for historical data retrieval in yyyy-MM-dd format.
          example: "2026-04-01"
        endDate:
          type: string
          format: date
          description: Optional end date (inclusive) for historical data retrieval in yyyy-MM-dd format.
          example: "2026-04-20"

    HACResponse:
      type: object
      description: |
        Parsed **HAC** response (EBICS 3.0 ch.10): **pain.002** with extracted `StsRsnInf` rows in `statusReasons`
        (originator, optional identifications, reason code, optional EBICS annex name/description, and additional lines).
      properties:
        ebicsUserId:
          type: string
          description: Resolved EBICS user id for this response.
          example: "ZKB03305"
        statusReasons:
          type: array
          description: Extracted status reason blocks from **pain.002** (`StsRsnInf`).
          items:
            $ref: '#/components/schemas/HacStsRsnInfEntry'
        message:
          type: string
          nullable: true
          description: Human-readable detail from the EBICS client or transport layer; null on success.
        status:
          type: string
          nullable: true
          description: Client-side status (e.g. `ERROR` on failure); null when the HAC order completed without client-side error.

paths:
  # ════════════════════════════════════════════
  # AUTHENTICATION (no JWT required)
  # ════════════════════════════════════════════
  /swp/v1/billers/authenticate:
    post:
      summary: Authenticate – obtain JWT
      description: |
        Exchange `billerPid` + `billerSecret` for a JWT.

        The returned token contains `scopes` derived from your account status:
        - `EBILL` — if your biller is in `EbillOnboarded` status
        - `EBICS` — if your biller has `ebicsStatus = ACTIVE`

        The `EBICS` scope is required to call any `/client/ebics/*` endpoint.
      operationId: authenticateBiller
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
            example:
              billerPid: "41140074442216296"
              billerSecret: "s3cr3t-uuid-value"
      responses:
        '200':
          description: JWT issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '401':
          description: Invalid credentials or biller not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════
  # HEALTH
  # ════════════════════════════════════════════
  /client/ebics/healthcheck:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy

  # ════════════════════════════════════════════
  # EBICS v3 (H005) — requires EBICS scope
  # ════════════════════════════════════════════
  /client/ebics/v3/htd:
    post:
      summary: HTD – List subscribed BTF formats 
      description: |
        Returns the list of EBICS BTF (Business Transaction Formats) subscribed for this biller at the bank.
        Use the returned `serviceName`, `scope`, `msgName`, `msgNameVersion`, and `containerType`
        values directly in BTU/BTD requests.
      operationId: v3Htd
      tags: [EBICS v3 Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTDRequest'
            example: {}
      responses:
        '200':
          description: List of subscribed BTF (Business Transaction Formats) 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTDResponse'
              examples:
                htdListingBTFsAndAccounts:
                  summary: HTD response example listing allowed BTFs and accounts
                  value:
                    ebicsUserId: "ZKB03305"
                    businessTransactionFormats:
                      - serviceName: "MCT"
                        scope: "CH"
                        serviceOption: null
                        containerType: null
                        msgName: "pain.001"
                        msgNameVersion: "09"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "MCT"
                        scope: "CH"
                        serviceOption: null
                        containerType: null
                        msgName: "pain.001"
                        msgNameVersion: "03"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "PSR"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "pain.002"
                        msgNameVersion: "03"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "PSR"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "pain.002"
                        msgNameVersion: "10"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "EOP"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "camt.053"
                        msgNameVersion: "04"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "EOP"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "camt.053"
                        msgNameVersion: "08"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "REP"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "camt.054"
                        msgNameVersion: "04"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "REP"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "camt.054"
                        msgNameVersion: "08"
                        msgNameVariant: null
                        msgNameFormat: null
                    message: null
                    status: null
                    accounts:
                      - id: "12345"
                        currency: "CHF"
                        description: null
                        accountHolder: "Mustermann AG"
                        structuredAccountNumbers:
                          - value: "CH3900700115651849173"
                            international: true
                          - value: "651849173"
                            international: false
                        nationalAccountNumbers: []
                        structuredBankCodes:
                          - value: "RAIFCH22XXX"
                            international: true
                            prefix: null
                        nationalBankCodes:
                          - value: "81356"
                            format: "other"
        '401':
          description: |
            Unauthorized. Returned when:
            - the JWT is missing, invalid, or lacks the `EBICS` scope, or
            - the biller's `ebicsStatus` is no longer `ACTIVE` after the token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingEbicsScope:
                  summary: JWT is missing the EBICS scope
                  value:
                    error: "Unauthorized: missing EBICS scope"
                ebicsStatusInactive:
                  summary: Biller is no longer EBICS-active
                  description: Returned when `ebicsStatus` flips off after the JWT was issued.
                  value:
                    error: "Unauthorized: billerPid is not valid or biller is not active"

  # BTU upload — maintained in ebics-biller-upload-api.yaml
  "/client/ebics/v3/btu":
    $ref: './ebics-biller-upload-api.yaml#/paths/~1client~1ebics~1v3~1btu'
  "/client/ebics/v3/pain001":
    $ref: './ebics-biller-upload-api.yaml#/paths/~1client~1ebics~1v3~1pain001'

  /client/ebics/v3/btd:
    post:
      summary: BTD – Download file
      description: |
        Download a file (e.g. statement, report, etc.) from the bank via EBICS H005 BTD.

        Call **HTD** first to retrieve the exact BTF (Business Transaction Format) parameters subscribed for your account.

        **Common BTF parameters in European Banks:**
        | serviceName | msgName | msgNameVersion | containerType | description |
        |---|---|---|---|---|
        | EOP | camt.053 | 04 or 08 | ZIP | End of day statements |
        | STM | camt.052 | 04 or 08 | ZIP | Intraday statements |
        | REP | camt.054 | 04 or 08 | ZIP | Credit/Debit notifications |
        | PSR | pain.002 | 03 or 10 | ZIP | Payment status reports |
      operationId: v3Btd
      tags: [EBICS v3 Download]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BTDRequest'
            examples:
              camt053StatementActual:
                summary: Daily account statement request (Actual)
                description: Camt053 v08 statement (actual download of not-yet downloaded files from bank).
                value:
                  serviceName: "EOP"
                  scope: "CH"
                  msgName: "camt.053"
                  msgNameVersion: "08"
                  containerType: "ZIP"
              camt053StatementHistorical:
                summary: Daily account statement request (Historical)
                description: Camt053 v08 statement (historical download for given date range).
                value:
                  serviceName: "EOP"
                  scope: "CH"
                  msgName: "camt.053"
                  msgNameVersion: "08"
                  containerType: "ZIP"
                  startDate: "2026-04-01"
                  endDate: "2026-04-20"
              camt052IntradayReportActual:
                summary: Intraday account report request (Actual)
                description: Camt052 v08 statement (actual download of not-yet downloaded files from bank).
                value:
                  serviceName: "STM"
                  scope: "CH"
                  msgName: "camt.052"
                  msgNameVersion: "08"
                  containerType: "ZIP"
              camt052IntradayReportHistorical:
                summary: Intraday account report request (Historical)
                description: Camt052 v08 statement (historical download for given date range).
                value:
                  serviceName: "STM"
                  scope: "CH"
                  msgName: "camt.052"
                  msgNameVersion: "08"
                  containerType: "ZIP"
                  startDate: "2026-04-20"
                  endDate: "2026-04-20"
      responses:
        '200':
          description: File downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BTDResponse'
              examples:
                successfulBtdDownloadDataAvailable:
                  summary: Successful BTD download - data available
                  description: Example response when BTD completes successfully and file data is available (signed cloud URL).
                  value:
                    ebicsUserId: "ZKB03305"
                    status: "SUCCESS"
                    message: "BTD download completed successfully"
                    cloudUrl: "https://storage.googleapis.com/billte-ebics-client-file-uploads/ebicsDocs/BTD/BTD_2026-05-01T19%3A38%3A28.336061Z_ZKB03305.zip?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=billte-ebics-storage%40billte-ebics-client.iam.gserviceaccount.com%2F20260501%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260501T193829Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-Signature=5e2da1915627ed0e4ff5936220c12a1f4e241e96681431f449521b8da9d3c6f33288ed1ebb3bf0561c73d77e8a6e167e5822b743b3de098037d9c6b03d751e6316b1a15fbe"
                    partialFilePath: "ebicsDocs/BTD/BTD_2026-05-01T19:38:28.336061Z_ZKB03305.zip"
                    transactionId: null
                    orderId: null
                    dataAvailabilityStatus: "AVAILABLE"
                    headerReturnCode: "000000"
                    headerReturnText: "[EBICS_OK] OK"
                    bodyReturnCode: "000000"
                    bodyReturnText: "000000"
                    bodyReturnSymbolicName: "EBICS_OK"
                unsuccessfulBtdDownloadNoData:
                  summary: Unsuccessful BTD download - data not available
                  description: Example 200 response when the operation succeeds but no download data exists for the requested date range.
                  value:
                    ebicsUserId: "ZKB03305"
                    status: "SUCCESS"
                    message: "No data available for the requested date range"
                    cloudUrl: null
                    partialFilePath: null
                    transactionId: null
                    orderId: null
                    dataAvailabilityStatus: "NO_DATA"
                    headerReturnCode: null
                    headerReturnText: null
                    bodyReturnCode: "090005"
                    bodyReturnText: "No download data available"
                    bodyReturnSymbolicName: "EBICS_NO_DOWNLOAD_DATA_AVAILABLE"
        '401':
          description: |
            Unauthorized. Returned when:
            - the JWT is missing, invalid, or lacks the `EBICS` scope, or
            - the biller's `ebicsStatus` is no longer `ACTIVE` after the token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingEbicsScope:
                  summary: JWT is missing the EBICS scope
                  value:
                    error: "Unauthorized: missing EBICS scope"
                ebicsStatusInactive:
                  summary: Biller is no longer EBICS-active
                  description: Returned when `ebicsStatus` flips off after the JWT was issued.
                  value:
                    error: "Unauthorized: billerPid is not valid or biller is not active"
        '500':
          description: |
            Internal server error. If `EBICS_INVALID_ORDER_IDENTIFIER` is returned, the user must
            first call the HTD/HAA operation to retrieve a valid list of supported BTF formats for
            the BTD parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BTDResponse'
              examples:
                ebicsInvalidOrderIdentifier:
                  summary: BTD execution error
                  description: |
                    Example when the bank rejects the BTF (e.g. unknown or disallowed BTF format). The
                    error text includes `[EBICS_INVALID_ORDER_IDENTIFIER]`. Use BTF parameters from HTD/HAA.
                  value:
                    ebicsUserId: "ZKB03305"
                    status: "ERROR"
                    message: "Failed to execute BTD: Error in executing BTD :: ZKB03305 :: Error during BTD execution: [EBICS_INVALID_ORDER_IDENTIFIER] Auftragsart unzulässig"
                    cloudUrl: null
                    partialFilePath: null
                    transactionId: null
                    orderId: null
                    dataAvailabilityStatus: null
                    headerReturnCode: null
                    headerReturnText: null
                    bodyReturnCode: null
                    bodyReturnText: null
                    bodyReturnSymbolicName: null

  /client/ebics/v3/haa:
    post:
      summary: HAA – Retrievable download data
      description: |
        EBICS 3.0 H005 **HAA** (“available downloads” / retrievable order data): lists **business transaction formats (BTFs)
        for which the bank currently has data ready to retrieve via BTD operation**.

        **Note** This operation is usefull only for actual data (non-historical downloads). 

        Contrast with **HTD**, which returns the **subscribed** BTF catalogue and account metadata. Use **HTD** to know
        which BTF parameters are allowed for your user; use **HAA** to see which of those download types
        actually have pending files **before** you call **BTD** for actual data (or to prioritize polling).

        The request body is empty — `ebicsUserId` and `billerId` are resolved internally from your JWT.
      operationId: v3Haa
      tags: [EBICS v3 Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HAARequest'
            example: {}
      responses:
        '200':
          description: HAA executed successfully — bank returned available-download descriptors (often under `services`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HAAResponse'
              examples:
                haaWithPendingDownloads:
                  summary: Services with data ready to download
                  description: |
                    Example HAA response showing the BTFs having retrievable data for non-historical downloads (pain.002 and camt.053). 
                    After calling BTD for actual data, the bank will mark the data as downloaded, and they will not appear in the next HAA response.
                  value:
                    ebicsUserId: "ZKB03305"
                    status: null
                    message: null
                    services:
                      - serviceName: "PSR"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "pain.002"
                        msgNameVersion: "10"
                        msgNameVariant: null
                        msgNameFormat: null
                      - serviceName: "EOP"
                        scope: "CH"
                        serviceOption: null
                        containerType: "ZIP"
                        msgName: "camt.053"
                        msgNameVersion: "08"
                        msgNameVariant: null
                        msgNameFormat: null
                haaNothingPending:
                  summary: No pending downloadable data available
                  describtion: No pending downloadable data available, it means that any call to BTD for actual data (non-historical downloads) will return no data.
                  value:
                    ebicsUserId: "ZKB03305"
                    status: null
                    message: null
                    services: []
        '401':
          description: |
            Unauthorized. Returned when:
            - the JWT is missing, invalid, or lacks the `EBICS` scope, or
            - the biller's `ebicsStatus` is no longer `ACTIVE` after the token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingEbicsScope:
                  summary: JWT is missing the EBICS scope
                  value:
                    error: "Unauthorized: missing EBICS scope"
                ebicsStatusInactive:
                  summary: Biller is no longer EBICS-active
                  description: Returned when `ebicsStatus` flips off after the JWT was issued.
                  value:
                    error: "Unauthorized: billerPid is not valid or biller is not active"
        '500':
          description: |
            Internal server error during HAA (downstream EBICS host, transport, or parsing). Matches the EBICS client
            behaviour of returning HTTP 500 with a JSON body where `status` is `ERROR` and `message` carries details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HAAResponse'
              examples:
                haaExecutionError:
                  summary: HAA execution failed
                  value:
                    ebicsUserId: "ZKB03305"
                    status: "ERROR"
                    message: "Failed to execute HAA: Error in executing HAA :: ZKB03305 :: …"
                    services: []

  /client/ebics/v3/hac:
    post:
      summary: HAC – Customer acknowledgements (pain.002)
      description: |
        Returns order statuses (or HACs - Host Customer Acknowledgement) for the given date range.
        EBICS 3.0 H005 **HAC** (Host Customer Acknowledgement): downloads **customer acknowledgements** as ISO 20022
        **pain.002** (EBICS 3.0 ch.10). 
        
        The EBICS client parses the message and surfaces extracted **`StsRsnInf`**
        blocks: originator name, optional **`OrgId/Othr`** identifications, **`Rsn/Cd`**, optional EBICS annex
        **`reasonName` / `reasonDescription`**, and **`AddtlInf`** lines.

        Typical use: after **BTU**, reconcile **technical / signature** status before relying on **BTD** pain.002 PSR,
        **C54**, **C52**, or **C53** (see BTU flow in the EBICS client API docs).

        The request body may be `{}` or include optional inclusive **`yyyy-MM-dd`** `startDate` / `endDate` (see
        `HACRequest`); `ebicsUserId` and `billerId` are resolved internally from your JWT.

        **Note:** Send **both** dates together for a historical window, or **neither** for delta / “since last HAC”
        behaviour (bank-dependent). 
      operationId: v3Hac
      tags: [EBICS v3 Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HACRequest'
            examples:
              hacActualDownload:
                summary: Actual HAC download
                description: Download actual HAC order statuses
                value: {}
              hacHistoricalDownload:
                summary: Historical HAC download
                description: Download historical HAC statuses for the given date range (inclusive).
                value:
                  startDate: "2026-04-01"
                  endDate: "2026-04-20"
      responses:
        '200':
          description: |
            HAC executed successfully — parsed **`statusReasons`** from pain.002 (may be empty if there is nothing new
